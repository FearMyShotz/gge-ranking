name: Sync current Gacha
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_gacha.py"
      - "tests/**"
      - ".github/workflows/sync-gacha.yml"
concurrency:
  group: sync-current-gacha
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/update_gacha.py
      - name: Publish verified selection
        run: |
          git add events.json active-gacha.json
          if git diff --cached --quiet; then
            echo "Selection unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Sync active Gacha ranking from official client"
          git push origin HEAD:main
